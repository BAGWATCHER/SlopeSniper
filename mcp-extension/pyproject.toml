[project]
name = "slopesniper-mcp"
version = "0.3.41"
description = "SlopeSniper MCP Server - Safe Solana Token Trading"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "solders>=0.21.0",
    "base58>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "cryptography>=42.0.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.scripts]
slopesniper = "slopesniper_skill.cli:main"
slopesniper-mcp = "slopesniper_mcp.server:main"
slopesniper-api = "slopesniper_api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slopesniper_mcp", "src/slopesniper_skill", "src/slopesniper_api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B904", "B905"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
