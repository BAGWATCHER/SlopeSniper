name: Bug report
description: Report a reproducible SlopeSniper bug
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: slopesniper version
  - type: dropdown
    id: funds
    attributes:
      label: Did this involve real funds or private keys?
      options:
        - "No"
        - "Yes - I will avoid posting sensitive details publicly"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove keys, wallet addresses if desired, and tokens before posting.
      render: shell
